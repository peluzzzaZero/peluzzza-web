<script>
const pack = JSON.parse(document.getElementById("pack").textContent);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
document.getElementById("gate").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const form = ev.currentTarget;
  const err = document.getElementById("err");
  err.hidden = true;
  try {
    const material = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(document.getElementById("pw").value),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      {name: "PBKDF2", salt: b64(pack.salt), iterations: pack.iter, hash: "SHA-256"},
      material,
      {name: "AES-GCM", length: 256},
      false,
      ["decrypt"]
    );
    const clear = await crypto.subtle.decrypt(
      {name: "AES-GCM", iv: b64(pack.iv)},
      key,
      b64(pack.data)
    );
    const slot = document.getElementById("body");
    slot.innerHTML = new TextDecoder().decode(clear);
    slot.hidden = false;
    form.hidden = true;
  } catch (e) {
    err.hidden = false;
  }
});
</script>
